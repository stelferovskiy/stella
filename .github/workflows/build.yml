name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build NSIS installer
        run: npm run dist

      # Signing step (SignPath) will be added here after the SignPath Foundation application is approved.

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stella-Setup
          path: dist/Stella-Setup-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Stella ${{ steps.v.outputs.version }}
          files: dist/Stella-Setup-*.exe
          generate_release_notes: true
